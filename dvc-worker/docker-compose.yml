services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: dvcworker
      POSTGRES_PASSWORD: dvcworker
      POSTGRES_DB: dvcworker
    ports:
      - "5433:5432"
    volumes:
      - dvcworker_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dvcworker"]
      interval: 5s
      timeout: 5s
      retries: 10

  worker:
    build: .
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://dvcworker:dvcworker@postgres:5432/dvcworker
    ports:
      - "8090:8090"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  dvcworker_pg_data:
